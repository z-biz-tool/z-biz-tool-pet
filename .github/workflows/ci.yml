name: CI

# 每次 push / PR 做前端门禁 + Rust 单测。
#
# 2026-10-21 加了 macOS 腿。原来的注释是「只有 windows：截图走 Win32 GDI（windows crate），
# macOS 腿还没有对应实现，放进矩阵只会得到一个必然失败的 job」——
# 那条判断当时是对的，但**根因在依赖声明**，不在「macOS 没有对应实现」：
# `windows` crate 之前是**无条件依赖**，而上游 `windows-future 0.3.2` 的
# `async_spawn.rs` 无条件调用 `windows_threading::submit`（该 crate 整个是 `#![cfg(windows)]`）
# ⇒ 在 macOS / Linux 上编译 pet **必然**报
#   error[E0425]: cannot find function `submit` in crate `windows_threading`
# 现在 `windows` 改成了 `[target.'cfg(windows)'.dependencies]`，非 Windows 平台不再编它，
# 截图能力在非 Windows 上由同名 stub 返回明确错误（口径与 runtime.rs 一致：
# 「能力缺口不做成静默成功」）。
#
# 这条 macOS 腿的价值：**它会守住「别再把 Windows-only 依赖拖成无条件依赖」这件事**。
# 没有它，下次谁把 `windows` 改回无条件依赖，仓库在 macOS / Linux 上又编不过了，
# 而 Windows-only 的 CI **永远发现不了**。
#
# 为什么只加 macOS 不加 ubuntu：Linux 上 `cargo test` 要先 apt 装一整套 GTK/WebKit，
# 装失败的信息看起来还像代码问题（mind 的 CI 注释里记了同一个坑）。
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      # GitHub 新 token 会写坏 dtolnay 生成的 cargo config（2026-10-03 收编进模板）
      - name: Reset broken cargo config
        shell: bash
        run: rm -f "$USERPROFILE/.cargo/config.toml"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (renderer)
        run: npm run typecheck

      # 只把 error 作为硬门禁，react-hooks/exhaustive-deps 等 warning 暂不阻断
      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      # tauri::generate_context! 读 build.frontendDist=../dist/renderer，必须先有 dist/
      - name: Rust tests
        working-directory: src-tauri
        # `-- --nocapture`：Rust 测试框架默认**吞掉通过用例的 stdout/stderr**
        # ⇒ 本仓「[LIVE] 跳过 minimax 真实 API 实测…」这类跳过标记在 CI 日志里
        # 看不见 ⇒ 「没跑」看着跟「跑过了」一样。打开捕获后可核对。
        run: cargo test --lib -- --nocapture

      # 端点台账：契约快照（scripts/endpoint-contract.json）里每一个都必须接通
      - name: Port ledger
        run: npm run port:status

  # macOS 腿：只跑 Rust 侧（前端门禁在 Windows 腿上已经跑过，不必重复）。
  # 它守的是**「非 Windows 平台必须能编译」**这条 —— 截图等 Win32 能力在 macOS 上
  # 表现为「命令在、但返回明确的不支持」，而不是「整仓编不过」。
  verify-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      # GitHub 新 token 会写坏 dtolnay 生成的 cargo config（2026-10-03 收编进模板）
      - name: Reset broken cargo config
        run: rm -f "$HOME/.cargo/config.toml"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # tauri::generate_context! 读 build.frontendDist=../dist/renderer，必须先有 dist/
      - name: Build frontend
        run: npm run build

      - name: Rust tests (macOS)
        working-directory: src-tauri
        run: cargo test --lib -- --nocapture
