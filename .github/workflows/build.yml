name: Build & Release

# 打 tag（v*）出包并建 GitHub Release —— update.rs 查的就是本仓的 Releases，
# 所以这里必须真的建 Release，只传 Actions artifact 的话客户端永远查不到新版本。
# 只有 windows 腿：截图是 Win32 GDI 直调，macOS 还没有对应实现。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # cap-hub 走 ../../z-biz-tool-capability path 依赖：runner 上只有本仓，
      # 先把公共能力仓取到 workspace 内，再链接成 src-tauri 的同级目录。
      - name: Checkout capability (path deps)
        uses: actions/checkout@v4
        with:
          repository: z-biz-tool/z-biz-tool-capability
          path: .capability

      - name: Link capability (Unix)
        if: runner.os != 'Windows'
        run: ln -sfn "$GITHUB_WORKSPACE/.capability" "$GITHUB_WORKSPACE/../z-biz-tool-capability"

      - name: Link capability (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\..\z-biz-tool-capability" -Target "$env:GITHUB_WORKSPACE\.capability" | Out-Null

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 同 CI：GitHub 新 token 会写坏 dtolnay 生成的 cargo config
      - name: Reset broken cargo config
        shell: bash
        run: rm -f "$USERPROFILE/.cargo/config.toml"

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '${{ github.ref_name }}'
          releaseBody: 'See the assets below to download this version.'
          releaseDraft: false
          prerelease: false
